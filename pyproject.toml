[project]
name = "a2ts"
version = "0.2.0.dev1"
description = "Contextualized Audio/Video Transcriber (Voxtral / Whisper)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Stany MARCEL", email = "stanypub@gmail.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
keywords = ["transcription", "whisper", "voxtral", "diarization", "speech-to-text", "rpg"]
dependencies = [
    "faster-whisper>=1.1.1",
    "pydantic>=2.10.0",
    "torch>=2.2.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "soundfile>=0.13.0",
    "tiktoken>=0.9.0",
    "librosa>=1.0.0",
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.26.0.51; sys_platform == 'linux' or sys_platform == 'win32'",
    "speechbrain>=1.1.1",
    "scikit-learn>=1.6.0",
    "transformers>=5.18.0.dev0",
]

[project.optional-dependencies]
voxtral = [
    "torch>=2.2.0",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.45.0",
    "mistral-common[audio]>=1.8.1",
]

[project.urls]
Homepage = "https://github.com/stany/a2ts"
Repository = "https://github.com/stany/a2ts"
Issues = "https://github.com/stany/a2ts/issues"

[project.scripts]
a2ts = "a2ts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.agents",
    "/.superpowers",
    "/scratch",
    "/contexte",
    "/recordings",
    "/docs/plans",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a2ts"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["scratch", ".superpowers", "docs"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers" }

